{% extends "base.html" %}
{% block title %}تغيير كلمة السر — CoachPage DZ{% endblock %}
{% block content %}
<div style="max-width:480px;margin:0 auto;padding:48px 20px 60px;text-align:center;">

  <div class="fade-up" style="margin-bottom:28px;">
    <div style="width:64px;height:64px;background:var(--green-dim);border:2px solid var(--green);border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>
    <h1 style="font-size:22px;font-weight:900;color:var(--text);margin:0 0 6px;">تغيير كلمة السر</h1>
    <p style="font-size:13px;color:var(--muted);">المدرب: <strong style="color:var(--text);">{{ coach.username }}</strong></p>
  </div>

  <div class="fade-up delay-1 card" style="text-align:right;margin-bottom:20px;background:var(--green-dim);border-color:#86efac;">
    <div style="display:flex;align-items:center;gap:8px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--green2)" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
      <span style="font-size:13px;color:var(--green2);font-weight:700;">رابط التحقق صالح — اختر كلمة سر جديدة</span>
    </div>
  </div>

  <form method="POST" class="fade-up delay-2" style="text-align:right;">
    <input type="hidden" name="token" value="{{ token }}"/>

    <div style="margin-bottom:16px;">
      <label class="lbl">كلمة السر الجديدة <span class="required">*</span></label>
      <input type="password" name="new_password" class="inp" placeholder="6 أحرف على الأقل" required minlength="6" autofocus/>
    </div>

    <div style="margin-bottom:22px;">
      <label class="lbl">تأكيد كلمة السر <span class="required">*</span></label>
      <input type="password" name="confirm_password" class="inp" placeholder="أعد إدخال كلمة السر" required/>
    </div>

    <button type="submit" class="btn-primary" style="margin-bottom:12px;">تغيير كلمة السر ←</button>
  </form>

  <a href="/coach/{{ coach.username }}/forgot-password" style="text-decoration:none;display:block;">
    <button class="btn-ghost" style="width:100%;">طلب رابط جديد</button>
  </a>

</div>
{% endblock %}
