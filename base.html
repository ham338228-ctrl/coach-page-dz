<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>{% block title %}CoachPage DZ{% endblock %}</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap');

    * { box-sizing: border-box; }

    :root {
      --bg:        #0a1a0c;
      --bg2:       #0e2010;
      --card:      #0f2312;
      --card2:     #152a18;
      --border:    rgba(34,197,94,0.13);
      --border2:   rgba(34,197,94,0.22);
      --text:      #ddf0e0;
      --text2:     #9dc9a3;
      --muted:     #4e7a55;
      --green:     #22c55e;
      --green2:    #4ade80;
      --green3:    #16a34a;
      --green-dim: rgba(34,197,94,0.07);
      --green-glow:rgba(34,197,94,0.18);
      --gold:      #eab308;
      --gold-dim:  rgba(234,179,8,0.08);
      --gold-bg:   rgba(234,179,8,0.12);
      --red:       #f87171;
      --red-bg:    rgba(248,113,113,0.09);
      --orange:    #fb923c;
      --orange-bg: rgba(251,146,60,0.09);
      --yellow:    #fbbf24;
      --yellow-bg: rgba(251,191,36,0.09);
      --shadow:    0 2px 16px rgba(0,0,0,0.35);
      --shadow-lg: 0 8px 40px rgba(0,0,0,0.5);
    }

    body {
      font-family: 'Tajawal', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      margin: 0;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg2); }
    ::-webkit-scrollbar-thumb { background: var(--green3); border-radius: 2px; }

    .ring-container { position: relative; display: inline-flex; align-items: center; justify-content: center; }
    .ring-label { position: absolute; text-align: center; }

    .macro-bar-fill {
      height: 100%;
      border-radius: 9999px;
      transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .heatmap-day {
      width: 10px; height: 10px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .heatmap-day.green  { background: var(--green); box-shadow: 0 0 5px rgba(34,197,94,0.45); }
    .heatmap-day.red    { background: rgba(248,113,113,0.45); }
    .heatmap-day.empty  { background: rgba(255,255,255,0.06); }

    .tag {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--bg2); color: var(--text2);
      padding: 4px 10px; border-radius: 9999px;
      font-size: 13px; cursor: pointer;
      border: 1px solid var(--border);
      transition: all 0.15s;
    }
    .tag:hover { border-color: var(--green); color: var(--green); background: var(--green-dim); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes glow-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
      50%       { box-shadow: 0 0 20px 4px rgba(34,197,94,0.22); }
    }
    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .fade-up  { animation: fadeUp 0.45s ease both; }
    .delay-1  { animation-delay: 0.08s; }
    .delay-2  { animation-delay: 0.16s; }
    .delay-3  { animation-delay: 0.24s; }
    .delay-4  { animation-delay: 0.32s; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .card:hover { border-color: var(--border2); }

    .card-accent { border-right: 3px solid var(--green); }

    .card-green {
      background: var(--green-dim);
      border: 1px solid var(--border2);
      border-radius: 16px;
      padding: 20px;
    }

    .btn-primary {
      background: var(--green);
      color: #0a1a0c;
      font-weight: 900;
      border-radius: 12px;
      padding: 14px 24px;
      width: 100%;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Tajawal', sans-serif;
      font-size: 15px;
    }
    .btn-primary:hover  { background: var(--green2); transform: translateY(-1px); box-shadow: 0 4px 20px rgba(34,197,94,0.35); }
    .btn-primary:active { transform: translateY(0); box-shadow: none; }
    .btn-primary:disabled { background: var(--card2); color: var(--muted); cursor: not-allowed; }

    .btn-dark {
      background: var(--card2);
      color: var(--text);
      font-weight: 800;
      border-radius: 12px;
      padding: 14px 24px;
      width: 100%;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Tajawal', sans-serif;
      font-size: 15px;
    }
    .btn-dark:hover { border-color: var(--green); color: var(--green); transform: translateY(-1px); }

    .btn-white {
      background: var(--card2);
      color: var(--text);
      font-weight: 800;
      border-radius: 12px;
      padding: 14px 24px;
      width: 100%;
      border: 1.5px solid var(--border2);
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Tajawal', sans-serif;
      font-size: 15px;
    }
    .btn-white:hover { border-color: var(--green); color: var(--green); transform: translateY(-1px); }

    .btn-ghost {
      background: transparent;
      color: var(--text2);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px 20px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Tajawal', sans-serif;
      font-size: 14px;
    }
    .btn-ghost:hover { border-color: var(--green); color: var(--green); background: var(--green-dim); }

    .btn-danger {
      background: var(--red-bg);
      color: var(--red);
      border: 1.5px solid rgba(248,113,113,0.3);
      border-radius: 12px;
      padding: 12px 20px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Tajawal', sans-serif;
      font-size: 14px;
      width: 100%;
    }
    .btn-danger:hover { background: var(--red); color: #fff; }

    .inp {
      width: 100%;
      background: var(--bg2);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-family: 'Tajawal', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .inp:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(34,197,94,0.12);
      background: var(--card);
    }
    .inp::placeholder { color: var(--muted); }
    .inp option { background: #0e2010; color: var(--text); }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(10,26,12,0.96);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-around;
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
      z-index: 50;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.4);
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      cursor: pointer; color: var(--muted);
      font-size: 10px; font-family: 'Tajawal', sans-serif;
      transition: color 0.2s;
      text-decoration: none;
      padding: 4px 16px;
      border-radius: 8px;
    }
    .nav-item.active { color: var(--green); }
    .nav-item:hover  { color: var(--green2); }

    .badge-green  { background: var(--green-dim); color: var(--green2); border: 1px solid var(--border2); border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
    .badge-yellow { background: var(--yellow-bg); color: var(--yellow); border: 1px solid rgba(251,191,36,0.3); border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
    .badge-red    { background: var(--red-bg); color: var(--red); border: 1px solid rgba(248,113,113,0.3); border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
    .badge-orange { background: var(--orange-bg); color: var(--orange); border: 1px solid rgba(251,146,60,0.3); border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 700; }

    .toast {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      padding: 12px 20px; border-radius: 12px; z-index: 9999;
      font-size: 14px; font-weight: 700;
      animation: fadeUp 0.4s ease;
      max-width: 90vw; text-align: center;
      box-shadow: var(--shadow-lg);
      pointer-events: none;
    }
    .toast.success { background: var(--green-dim); color: var(--green2); border: 1px solid var(--border2); }
    .toast.error   { background: var(--red-bg); color: var(--red); border: 1px solid rgba(248,113,113,0.3); }
    .toast.warning { background: var(--yellow-bg); color: var(--yellow); border: 1px solid rgba(251,191,36,0.3); }

    .glow-ring { animation: glow-pulse 2.5s ease-in-out infinite; }

    .stat-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .stat-box .stat-val { font-size: 28px; font-weight: 900; color: var(--text); }
    .stat-box .stat-val.green { color: var(--green); }
    .stat-box .stat-lbl { font-size: 11px; color: var(--muted); margin-top: 3px; }

    .divider { height: 1px; background: var(--border); margin: 16px 0; }

    .section-label {
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 2px;
      color: var(--muted); margin-bottom: 12px;
    }

    .lbl { font-size: 12px; color: var(--text2); display: block; margin-bottom: 5px; font-weight: 600; }
    .required { color: var(--red); }
    .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }

    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted); font-size: 13px; font-weight: 700;
      text-decoration: none; padding: 8px 14px;
      border-radius: 10px; border: 1px solid var(--border);
      background: var(--card); transition: all 0.2s;
      font-family: 'Tajawal', sans-serif;
    }
    .back-btn:hover { border-color: var(--green); color: var(--green); background: var(--green-dim); }

    .trial-banner {
      padding: 14px 18px; border-radius: 12px;
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 16px; font-size: 14px; font-weight: 700;
    }
    .trial-banner.expiring { background: var(--orange-bg); border: 1px solid rgba(251,146,60,0.3); color: var(--orange); }
    .trial-banner.expired  { background: var(--red-bg); border: 1px solid rgba(248,113,113,0.3); color: var(--red); }
    .trial-banner.active   { background: var(--green-dim); border: 1px solid var(--border2); color: var(--green2); }

    /* ── DESKTOP CONTAINMENT (mobile untouched below 640px) ── */
    @media (min-width: 640px) {
      body { background: #0a0f0d; }
      #app-shell {
        max-width: 560px;
        margin: 0 auto;
        min-height: 100vh;
        background: var(--bg);
        box-shadow: 0 0 60px rgba(0,0,0,0.5);
        border-inline: 1px solid var(--border);
      }
    }
  </style>
</head>
<body>

  <div id="app-shell">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="toast {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
  </div>

  <script>
    document.querySelectorAll('.toast').forEach(t => {
      setTimeout(() => {
        t.style.opacity = '0';
        t.style.transition = 'opacity 0.5s';
        setTimeout(() => t.remove(), 500);
      }, 3500);
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
